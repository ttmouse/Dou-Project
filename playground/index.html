<!doctype html>
<html lang="zh-CN" data-theme="dark">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProjectManager · 设计 Playground</title>
<style>
:root{color-scheme:dark;--bg:#141516;--surface:#1d1e20;--raised:#252629;--text:#eeeef0;--muted:#a4a6ad;--line:#303135;--blue:#83b7ff;--selected:#26364c;--green:#8ad5a6;--chip:#2a2c30;--space:20px}
:root[data-theme=light]{color-scheme:light;--bg:#f4f5f7;--surface:#fff;--raised:#ebeef2;--text:#20232a;--muted:#626773;--line:#dce0e6;--blue:#285fa8;--selected:#e9f1fd;--green:#297448;--chip:#eef0f3}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button,select{cursor:pointer}button{color:inherit}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:3px}button{border:0;background:none}button:hover{background:var(--raised)}header{max-width:1600px;margin:auto;padding:32px 36px 24px}.eyebrow{font-size:11px;font-weight:600;letter-spacing:2px;color:var(--muted)}.heading{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:8px 0 18px}h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.8px}.subtitle{color:var(--muted);margin:6px 0 0;font-size:13px}.theme{border:1px solid var(--line);border-radius:8px;padding:8px 13px;white-space:nowrap}.controls{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center}.tabs{display:flex;padding:4px;border-radius:10px;background:var(--surface);border:1px solid var(--line);gap:3px;flex-wrap:wrap}.tabs button{padding:8px 15px;border-radius:6px;color:var(--muted)}.tabs button[aria-pressed=true]{background:var(--raised);color:var(--text)}.options{display:flex;align-items:center;gap:16px;color:var(--muted);font-size:12px}.options label{display:flex;align-items:center;gap:8px}input[type=range]{width:88px;accent-color:var(--blue)}input[type=checkbox]{accent-color:var(--blue)}main{max-width:1600px;padding:0 36px 36px;margin:auto}.direction{display:flex;align-items:baseline;gap:15px;border-top:1px solid var(--line);padding:18px 0}.direction strong{font-weight:500;white-space:nowrap}.direction span{color:var(--muted);font-size:13px}.workspace{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface)}.bar-title{display:flex;align-items:center;gap:12px}.count{font-size:11px;color:var(--muted);border-left:1px solid var(--line);padding-left:12px}.search{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:7px;padding:6px 9px;max-width:220px;color:var(--muted)}.search input{background:none;border:0;outline:none;color:var(--text);min-width:0;width:100%;font-size:12px}.boards{display:grid;grid-template-columns:1fr}.boards.compare{grid-template-columns:1fr 1fr}.pane{min-width:0;padding:20px}.pane+.pane{border-left:1px solid var(--line)}.pane-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;color:var(--muted);font-size:12px}.pane-title select{border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--text);padding:5px 8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:var(--space)}.card{text-align:left;width:100%;min-width:0;background:var(--surface);border-radius:11px;padding:var(--space);display:flex;flex-direction:column;gap:13px;min-height:164px;transition:background .15s;position:relative}.card:hover{background:var(--raised)}.card[aria-pressed=true]{background:var(--selected);box-shadow:inset 0 0 0 1px var(--blue)}.topline{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;min-width:0}.name{font-size:17px;line-height:1.3;font-weight:600;letter-spacing:-.3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.status{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:400;color:var(--green);white-space:nowrap;padding-top:3px}.dot{width:5px;height:5px;background:currentColor;border-radius:50%;flex:none}.path{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta{display:flex;align-items:center;gap:16px;color:var(--muted);font-size:12px}.meta span{display:flex;align-items:center;gap:5px}.icon{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.5;flex:none}.bottom{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;min-height:23px}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:11px;line-height:21px;background:var(--chip);padding:0 7px;border-radius:5px;color:var(--muted)}.open-mark{color:var(--muted);opacity:0;font-size:15px}.card:hover .open-mark,.card:focus-visible .open-mark,.card[aria-pressed=true] .open-mark{opacity:1}.original .card{min-height:186px;gap:10px;border-radius:14px}.original .name{font-size:21px;font-weight:700}.original .path{font-size:14px}.original .meta{font-size:13px;gap:9px}.original .tag{font-size:13px;line-height:27px;color:#5fb6fa;background:#20394e}.original .tag.state,.original .tag.green{color:#8ad5a6;background:#294632}.original .tag.blue{color:#5fb6fa;background:#20394e}.original .bottom{margin-top:0}.original .open-mark{display:none}.compact .card{min-height:117px;gap:12px;padding:16px}.compact .name{font-size:15px}.compact .path{display:none}.compact .bottom{margin-top:0}.compact .meta{font-size:11px}.compact .status{font-size:0;gap:0}.compact .status .dot{width:6px;height:6px}.compact .tag{background:none;padding:0 5px 0 0;line-height:18px;font-size:10px}.quiet .grid{gap:0}.quiet .card{border-radius:0;background:none;min-height:167px;border-bottom:1px solid var(--line)}.quiet .card:hover{background:var(--surface)}.quiet .card[aria-pressed=true]{background:var(--selected)}.quiet .tag{background:none;padding:0 7px 0 0}.quiet .path{display:none}.quiet .name{font-size:17px;font-weight:500}.quiet .meta{margin-top:5px}.empty{grid-column:1/-1;padding:60px 15px;text-align:center;color:var(--muted)}footer{display:flex;justify-content:space-between;gap:16px;padding:14px 2px;font-size:11px;color:var(--muted)}.selection{color:var(--blue)}.path-on .path{display:block!important}.path-on .compact .card{min-height:145px}@media(min-width:1300px){.boards:not(.compare) .grid{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:900px){header{padding:24px 20px 20px}main{padding:0 20px 20px}.boards.compare{grid-template-columns:1fr}.pane+.pane{border-left:0;border-top:1px solid var(--line)}.direction{align-items:flex-start;flex-direction:column;gap:4px}.heading{align-items:flex-start}h1{font-size:25px}}@media(max-width:480px){header{padding:20px 14px 16px}main{padding:0 14px 16px}.tabs{width:100%}.tabs button{flex:1;padding:7px 8px;font-size:12px}.options{flex-wrap:wrap;gap:12px}.bar{padding:12px;flex-wrap:wrap}.search{max-width:none;width:100%}.pane{padding:12px}.heading{gap:10px}.theme{padding:6px 9px;font-size:12px}footer{flex-direction:column;gap:4px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<header>
 <div class="eyebrow">PROJECTMANAGER / PLAYGROUND</div>
 <div class="heading"><div><h1>让项目，成为视觉中心。</h1><p class="subtitle">同一批项目，四种呈现。切换、对比，再决定。</p></div><button class="theme" id="theme">切换浅色</button></div>
 <div class="controls"><nav class="tabs" aria-label="设计方案"><button data-mode="original" aria-pressed="false">原版参照</button><button data-mode="refined" aria-pressed="true">轻量卡片</button><button data-mode="compact" aria-pressed="false">紧凑卡片</button><button data-mode="quiet" aria-pressed="false">弱边界网格</button></nav><div class="options"><label>间距 <input id="spacing" type="range" min="12" max="28" value="20"><output id="space-value">20</output></label><label><input id="paths" type="checkbox">完整路径</label><label><input id="compare" type="checkbox">并排对比</label></div></div>
</header>
<main>
 <div class="direction"><strong id="direction-name"></strong><span id="direction-text"></span></div>
 <section class="workspace" aria-label="项目预览"><div class="bar"><div class="bar-title"><strong>项目</strong><span class="count" id="count"></span></div><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索项目名称…" aria-label="搜索项目名称"></label></div><div class="boards" id="boards"></div></section>
 <footer><span>示例数据 · Git 数字沿用截图，时间仅演示显示方式</span><span class="selection" id="selection" aria-live="polite">点击卡片预览选中状态</span></footer>
</main>
<script src="playground.js"></script>
</html>
